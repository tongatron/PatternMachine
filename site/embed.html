<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>PATTERN-MACHINE embed</title>
<style>
  html,body{margin:0;min-height:100%;background:#0a0a0b;overflow:hidden}
  iframe{display:block;width:100%;height:100vh;border:0}
  .empty{box-sizing:border-box;min-height:100vh;display:grid;place-items:center;padding:24px;color:#eee;font:14px/1.5 ui-monospace,monospace;text-align:center}
  .empty[hidden]{display:none!important}
</style>
</head>
<body>
<div class="empty" id="empty" hidden>Open a PATTERN-MACHINE project link to load the embed.</div>
<iframe id="app" title="PATTERN-MACHINE beat player" allow="autoplay"></iframe>
<script>
  const payload=location.hash.replace(/^#project=/,"");
  if(payload){
    document.getElementById("app").src=`./?embed=1#project=${payload}`;
  }else{
    document.getElementById("app").hidden=true;
    document.getElementById("empty").hidden=false;
  }
</script>
</body>
</html>
